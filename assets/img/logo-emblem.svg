<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="gsi-emblem-title">
  <title id="gsi-emblem-title">San Diego Spray Foam</title>

  <defs>
    <linearGradient id="gsi-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fdf0b8"/>
      <stop offset="16%"  stop-color="#f7cf55"/>
      <stop offset="44%"  stop-color="#ea9d08"/>
      <stop offset="56%"  stop-color="#a86a06"/>
      <stop offset="72%"  stop-color="#f0b628"/>
      <stop offset="100%" stop-color="#7d5200"/>
    </linearGradient>

    <linearGradient id="gsi-gold-flat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7cf55"/>
      <stop offset="55%"  stop-color="#ea9d08"/>
      <stop offset="100%" stop-color="#b87407"/>
    </linearGradient>

    <linearGradient id="gsi-ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ea9d08" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f5c53a" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="gsi-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="28%"  stop-color="#dcdee2"/>
      <stop offset="54%"  stop-color="#969ca4"/>
      <stop offset="76%"  stop-color="#e8eaed"/>
      <stop offset="100%" stop-color="#787e86"/>
    </linearGradient>

    <clipPath id="gsi-sky">
      <circle cx="500" cy="430" r="352"/>
    </clipPath>

    <path id="gsi-tagline-arc" d="M 206 807 A 478 478 0 0 0 794 807" fill="none"/>

    <!-- One palm crown, authored around origin (238,296). Each frond is a
         lens: outbound curve bulges one side, return curve the other, so the
         frond has real width instead of collapsing to a spike. -->
    <g id="gsi-palm-crown">
      <path d="M238 296 Q166 288 108 330 Q180 338 238 296 Z"/>
      <path d="M238 296 Q201 239 134 224 Q171 281 238 296 Z"/>
      <path d="M238 296 Q242 227 196 176 Q192 245 238 296 Z"/>
      <path d="M238 296 Q281 245 280 180 Q236 231 238 296 Z"/>
      <path d="M238 296 Q306 287 348 232 Q280 241 238 296 Z"/>
      <path d="M238 296 Q301 327 368 306 Q305 275 238 296 Z"/>
      <path d="M238 296 Q272 359 340 382 Q306 319 238 296 Z"/>
      <path d="M238 296 Q168 325 132 392 Q202 363 238 296 Z"/>
      <circle cx="238" cy="296" r="10"/>
    </g>
  </defs>

  <!-- ================================================= OUTER BADGE ====== -->
  <circle cx="500" cy="430" r="374" fill="#0b0b0c"/>
  <circle cx="500" cy="430" r="352" fill="#ffffff"/>
  <circle cx="500" cy="430" r="343" fill="none" stroke="url(#gsi-gold-flat)" stroke-width="9"/>

  <!-- ================================================= SKY SCENE ======= -->
  <g clip-path="url(#gsi-sky)">

    <!-- tapered sun rays, radiating from off-canvas upper right -->
    <g fill="url(#gsi-gold-flat)">
      <path d="M632 150 L916 98 L916 134 Z"/>
      <path d="M662 200 L924 164 L924 200 Z"/>
      <path d="M686 250 L930 228 L930 262 Z"/>
      <path d="M706 300 L934 290 L934 322 Z"/>
    </g>

    <!-- birds -->
    <g fill="none" stroke="#0b0b0c" stroke-width="7" stroke-linecap="round">
      <path d="M410 208 q17 -15 34 0"/>
      <path d="M444 208 q17 -15 34 0"/>
      <path d="M726 226 q13 -12 26 0"/>
      <path d="M752 226 q13 -12 26 0"/>
    </g>

    <!-- Coronado bridge, sweeping off to the right -->
    <g fill="#0b0b0c">
      <path d="M676 442 C 730 376, 792 346, 860 342 L 862 360 C 800 364, 742 392, 694 448 Z"/>
      <rect x="702" y="424" width="9" height="52"/>
      <rect x="736" y="404" width="9" height="72"/>
      <rect x="772" y="384" width="9" height="92"/>
      <rect x="810" y="368" width="9" height="108"/>
      <rect x="846" y="356" width="9" height="120"/>
    </g>

    <!-- skyline silhouette, baseline y=470 (tucks behind the banner) -->
    <g fill="#0b0b0c">
      <!-- low stepped block -->
      <path d="M250 470 V372 h26 v-16 h30 v114 Z"/>
      <!-- slim tower -->
      <rect x="312" y="318" width="30" height="152"/>
      <!-- stepped tower with antenna -->
      <path d="M348 470 V258 h70 v-20 h18 v20 h8 v232 Z"/>
      <rect x="378" y="206" width="6" height="34"/>
      <!-- short wide -->
      <rect x="446" y="356" width="42" height="114"/>
      <!-- slab with peaked cap -->
      <path d="M494 470 V300 h62 v170 Z"/>
      <path d="M494 300 l31 -28 l31 28 Z"/>
      <!-- hero pointed tower -->
      <path d="M566 470 V192 l32 -78 l32 78 v278 Z"/>
      <rect x="595" y="82" width="6" height="34"/>
      <!-- twin mid-rise -->
      <rect x="640" y="286" width="52" height="184"/>
      <path d="M640 286 l26 -22 l26 22 Z"/>
      <!-- rounded-top tower -->
      <path d="M700 470 V344 a22 22 0 0 1 44 0 v126 Z"/>
      <!-- ground line -->
      <rect x="140" y="462" width="730" height="12"/>
    </g>

    <!-- lit windows -->
    <g fill="url(#gsi-gold-flat)">
      <g>
        <rect x="258" y="390" width="9" height="14"/><rect x="276" y="390" width="9" height="14"/>
        <rect x="258" y="420" width="9" height="14"/><rect x="290" y="378" width="9" height="14"/>
        <rect x="290" y="410" width="9" height="14"/><rect x="276" y="440" width="9" height="14"/>
      </g>
      <g>
        <rect x="319" y="340" width="8" height="13"/><rect x="332" y="340" width="8" height="13"/>
        <rect x="319" y="370" width="8" height="13"/><rect x="332" y="400" width="8" height="13"/>
        <rect x="319" y="430" width="8" height="13"/>
      </g>
      <g>
        <rect x="360" y="284" width="10" height="16"/><rect x="380" y="284" width="10" height="16"/>
        <rect x="400" y="284" width="10" height="16"/><rect x="360" y="320" width="10" height="16"/>
        <rect x="400" y="320" width="10" height="16"/><rect x="360" y="356" width="10" height="16"/>
        <rect x="380" y="356" width="10" height="16"/><rect x="400" y="392" width="10" height="16"/>
        <rect x="360" y="392" width="10" height="16"/><rect x="380" y="428" width="10" height="16"/>
      </g>
      <g>
        <rect x="455" y="376" width="9" height="13"/><rect x="472" y="376" width="9" height="13"/>
        <rect x="455" y="404" width="9" height="13"/><rect x="472" y="432" width="9" height="13"/>
      </g>
      <g>
        <rect x="504" y="322" width="10" height="14"/><rect x="522" y="322" width="10" height="14"/>
        <rect x="540" y="322" width="10" height="14"/><rect x="504" y="354" width="10" height="14"/>
        <rect x="540" y="354" width="10" height="14"/><rect x="522" y="386" width="10" height="14"/>
        <rect x="504" y="418" width="10" height="14"/><rect x="540" y="418" width="10" height="14"/>
      </g>
      <g>
        <rect x="578" y="224" width="9" height="18"/><rect x="596" y="224" width="9" height="18"/>
        <rect x="614" y="224" width="9" height="18"/><rect x="578" y="262" width="9" height="18"/>
        <rect x="614" y="262" width="9" height="18"/><rect x="578" y="300" width="9" height="18"/>
        <rect x="596" y="300" width="9" height="18"/><rect x="614" y="300" width="9" height="18"/>
        <rect x="578" y="338" width="9" height="18"/><rect x="614" y="338" width="9" height="18"/>
        <rect x="596" y="376" width="9" height="18"/><rect x="578" y="376" width="9" height="18"/>
        <rect x="614" y="414" width="9" height="18"/><rect x="578" y="414" width="9" height="18"/>
      </g>
      <g>
        <rect x="650" y="308" width="10" height="15"/><rect x="670" y="308" width="10" height="15"/>
        <rect x="650" y="340" width="10" height="15"/><rect x="670" y="340" width="10" height="15"/>
        <rect x="650" y="372" width="10" height="15"/><rect x="670" y="404" width="10" height="15"/>
        <rect x="650" y="436" width="10" height="15"/>
      </g>
      <g>
        <rect x="710" y="366" width="9" height="14"/><rect x="726" y="366" width="9" height="14"/>
        <rect x="710" y="396" width="9" height="14"/><rect x="726" y="426" width="9" height="14"/>
      </g>
    </g>

    <!-- palms, left -->
    <g fill="#0b0b0c">
      <!-- tall palm: trunk + full crown -->
      <path d="M212 470 q12 -96 26 -170 l17 4 q-16 78 -24 166 Z"/>
      <use href="#gsi-palm-crown"/>
      <!-- short palm: same crown, scaled and nudged for variety -->
      <path d="M164 470 q8 -66 18 -114 l15 4 q-12 50 -18 110 Z"/>
      <g transform="translate(184,356) scale(0.6) translate(-238,-296)">
        <use href="#gsi-palm-crown"/>
      </g>
    </g>
  </g>

  <!-- ================================================= BANNER PLATE ==== -->
  <g>
    <path d="M42 470 L112 424 L888 424 L958 470 L958 664 L888 710 L112 710 L42 664 Z" fill="#0b0b0c"/>
    <path d="M60 478 L120 439 L880 439 L940 478 L940 656 L880 695 L120 695 L60 656 Z"
          fill="#ffffff" stroke="url(#gsi-gold-flat)" stroke-width="10"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Arial Black','Archivo Black',Archivo,Impact,'Helvetica Neue',sans-serif"
     font-weight="900" text-anchor="middle">
    <g transform="skewX(-9)">
      <!-- skewX(-9) shifts x left by tan(9°)·y, so x is pre-compensated -->
      <text x="591" y="573" font-size="126" textLength="786" lengthAdjust="spacingAndGlyphs"
            fill="#0b0b0c" stroke="#0b0b0c" stroke-width="15" stroke-linejoin="round">SAN DIEGO</text>
      <text x="591" y="573" font-size="126" textLength="786" lengthAdjust="spacingAndGlyphs"
            fill="url(#gsi-gold)">SAN DIEGO</text>
      <!-- top-edge highlight for a bevelled read -->
      <text x="591" y="570" font-size="126" textLength="786" lengthAdjust="spacingAndGlyphs"
            fill="none" stroke="#fdf0b8" stroke-width="2.5" opacity=".55">SAN DIEGO</text>
    </g>

    <g fill="url(#gsi-gold-flat)">
      <rect x="86" y="628" width="96" height="7"/>
      <rect x="86" y="644" width="70" height="7"/>
      <rect x="818" y="628" width="96" height="7"/>
      <rect x="844" y="644" width="70" height="7"/>
    </g>

    <g transform="skewX(-9)">
      <text x="605" y="662" font-size="74" textLength="500" lengthAdjust="spacingAndGlyphs"
            fill="#0b0b0c" letter-spacing="2">SPRAY FOAM</text>
    </g>
  </g>

  <!-- ================================================= SPRAY GUN ======= -->
  <g transform="translate(0,-54)">
    <!-- hose -->
    <path d="M330 856 q-44 -74 30 -104 q60 -24 122 -16" fill="none"
          stroke="#0b0b0c" stroke-width="24" stroke-linecap="round"/>
    <path d="M330 856 q-44 -74 30 -104 q60 -24 122 -16" fill="none"
          stroke="url(#gsi-gold-flat)" stroke-width="12" stroke-linecap="round"/>

    <g stroke="#0b0b0c" stroke-width="9" stroke-linejoin="round">
      <!-- barrel -->
      <rect x="392" y="726" width="196" height="60" rx="18" fill="url(#gsi-steel)"/>
      <!-- rear cap -->
      <rect x="364" y="736" width="32" height="40" rx="10" fill="url(#gsi-steel)"/>
      <!-- front collar + nozzle -->
      <rect x="588" y="738" width="44" height="36" rx="8" fill="url(#gsi-steel)"/>
      <path d="M632 744 L690 754 L690 758 L632 768 Z" fill="url(#gsi-steel)"/>
      <!-- contoured pistol grip -->
      <path d="M468 786 L524 786 L518 846 q-3 30 -25 30 q-22 0 -25 -30 Z" fill="url(#gsi-steel)"/>
      <!-- trigger -->
      <path d="M456 792 q-16 30 4 54" fill="none" stroke-width="13" stroke-linecap="round"/>
    </g>

    <!-- barrel ribs -->
    <g fill="#0b0b0c" opacity=".5">
      <rect x="418" y="742" width="8" height="28" rx="4"/>
      <rect x="440" y="742" width="8" height="28" rx="4"/>
      <rect x="462" y="742" width="8" height="28" rx="4"/>
    </g>

    <!-- spray cone -->
    <g fill="url(#gsi-gold-flat)" opacity=".92">
      <path d="M692 756 L832 704 L832 716 L692 758 Z"/>
      <path d="M692 758 L838 732 L838 742 L692 762 Z"/>
      <path d="M692 762 L840 762 L840 772 L692 766 Z"/>
      <path d="M692 766 L838 790 L838 800 L692 770 Z"/>
      <path d="M692 770 L832 816 L832 828 L692 774 Z"/>
    </g>

    <!-- foam burst -->
    <g fill="#ffffff" stroke="#0b0b0c" stroke-width="8">
      <path d="M838 706
               q32 -30 62 -8
               q38 -14 54 18
               q32 10 22 44
               q16 32 -18 48
               q-6 38 -46 34
               q-24 26 -58 8
               q-36 12 -54 -20
               q-32 -6 -26 -42
               q-20 -30 12 -52
               q0 -36 52 -30 Z"/>
    </g>
    <g fill="none" stroke="#ea9d08" stroke-width="6" opacity=".6" stroke-linecap="round">
      <path d="M872 742 q22 -14 42 4"/>
      <path d="M864 790 q26 -12 48 6"/>
      <path d="M888 834 q22 -10 38 2"/>
    </g>
  </g>

  <!-- ================================================= CURVED TAGLINE = -->
  <g fill="#0b0b0c"
     font-family="Archivo,'Arial Narrow',Arial,'Helvetica Neue',sans-serif"
     font-weight="700" font-size="17" letter-spacing="0.4">
    <text text-anchor="middle">
      <textPath href="#gsi-tagline-arc" startOffset="50%">
        SD NATIVE • FAMILY OWNED • SUPERIOR CRAFTSMANSHIP • HONEST PRICING
      </textPath>
    </text>
  </g>

  <!-- flanking tick marks, inside the tagline arc so the foam cannot hide them -->
  <g stroke="url(#gsi-gold-flat)" stroke-width="7" stroke-linecap="round">
    <path d="M170 742 l38 24"/>
    <path d="M146 776 l36 20"/>
    <path d="M830 742 l-38 24"/>
    <path d="M854 776 l-36 20"/>
  </g>
</svg>
